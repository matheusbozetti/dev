
##### Terminal / Neovim
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-features ",xterm*:extkeys"
# Undercurl + cor do sublinhado na forma kitty/Ghostty (dois-pontos simples + colorspace vazio).
# Tem que bater com o que o nvim emite direto: \e[4:3m e \e[58:2::R:G:Bm
set -as terminal-overrides ",*:Smulx=\E[4:%p1%dm"
set -as terminal-overrides ",*:Setulc=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%dm"

set -s extended-keys on
set -s focus-events on
set -s escape-time 10

##### Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"

# Escolha UM tema/status. Recomendo manter só esse:
# set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'colour6'
set -g @plugin "adibhanna/yukinord-tmux"

# yukinord options — MUST be set before `run tpm` (the theme reads them on load)
set -g @yukinord-tmux_window_id_style none      # none, digital, roman, super, sub, dsquare, hsquare
set -g @yukinord-tmux_pane_id_style super       # none, digital, roman, super, sub, dsquare, hsquare
set -g @yukinord-tmux_zoom_id_style none        # none, digital, roman, super, sub, dsquare, hsquare
set -g @yukinord-tmux_session_bg "on"           # on or off (transparent)
set -g @yukinord-tmux_window_center "off"       # on or off
set -g @yukinord-tmux_github_status on          # on or off
set -g @yukinord-tmux_show_path 1
set -g @yukinord-tmux_path_format relative      # relative or full


##### Panes / Windows
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
unbind c
unbind x
unbind w
unbind W
unbind k
unbind ,
unbind ,

bind ^W list-windows
bind s choose-tree -sZ
bind K kill-session

bind -r Q kill-pane
bind -r x kill-pane
bind -r X kill-session

bind -r S new-session -c "$HOME"

bind -r w new-window -c "#{pane_current_path}"
bind -r W new-window -c "$HOME"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r , switch-client -n
bind -r m switch-client -p

bind -r Tab switch-client -n
bind -r BTab switch-client -p

bind -r r command-prompt "rename-window %%"
bind -r ^R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display-message "tmux.conf recarregado"
bind -r = resize-pane -Z


bind b set-option -g status
bind * setw synchronize-panes


##### Behavior
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g renumber-windows on
set -g set-clipboard on
set -g mouse on
set -g history-limit 1000000

set -g set-titles on
set -g set-titles-string "#{pane_title}"

set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key -r o run-shell "tmux neww ~/.local/scripts/aws-ec2-connect"

bind-key g display-popup -E \
  -w 80% \
  -h 80% \
  -d "#{pane_current_path}" \
  "lazygit"

##### Visual
set -g status-position bottom
# set -g pane-active-border-style "fg=magenta,bg=default"
# set -g pane-border-style "fg=brightblack,bg=default"



##### TPM
run "~/.config/tmux/plugins/tpm/tpm"

# status-interval controls how often yukinord's right-side widgets refresh
set-option -g status-interval 5
